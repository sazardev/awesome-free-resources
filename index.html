<style>
  /* ================================================================
     Flat, borderless, dark-first. Pure black ground, no borders, no
     gradients, no shadows, no elevation. Separation comes from spacing
     and from three closely-related surface tones, never from outlines.

     The one motion primitive is a slow opacity breath used for skeletons
     and the load indicator. It was chosen over a shimmer specifically
     because a shimmer needs a gradient, and this page has none.
     ================================================================ */
  :root {
    --bg: #000000;
    --s1: #0b0b0d;
    --s2: #131316;
    --s3: #1c1c20;
    --s4: #26262b;
    --fg: #f4f4f5;
    --fg-2: #a8a8ae;
    --fg-3: #71717a;
    --r: 13px;
    --pad: 20px;
    --ease: cubic-bezier(.32, .72, 0, 1);
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --s1: #f7f7f8;
    --s2: #eeeef1;
    --s3: #e5e5e9;
    --s4: #d9d9de;
    --fg: #0a0a0b;
    --fg-2: #5a5a60;
    --fg-3: #8b8b92;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Inter", "Geist", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.011em;
  }
  code, kbd, .mono, .n, .host, .stat {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono",
                 "Geist Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: var(--fg); color: var(--bg); }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg-3); outline-offset: 3px; border-radius: 6px; }

  /* ---------------------------------------------------------- appbar */
  .appbar {
    position: sticky; top: 0; z-index: 60;
    background: var(--bg);
  }
  .bar {
    max-width: 1280px; margin: 0 auto;
    padding: 14px var(--pad);
    display: flex; align-items: center; gap: 12px;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; white-space: nowrap; }
  .brand b { font-size: 17px; font-weight: 600; letter-spacing: -0.028em; }
  .brand span { font-size: 12.5px; color: var(--fg-3); font-family: ui-monospace, SFMono-Regular, "Geist Mono", monospace; }
  .grow { flex: 1 1 auto; }

  /* search */
  .search { position: relative; flex: 1 1 380px; max-width: 560px; min-width: 200px; }
  .search input {
    width: 100%; padding: 10px 74px 10px 38px;
    background: var(--s2); color: var(--fg);
    border: 0; border-radius: 11px; outline: none;
    font-size: 15px; letter-spacing: -0.01em;
    transition: background .16s var(--ease);
  }
  .search input::placeholder { color: var(--fg-3); }
  .search input:focus { background: var(--s3); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search svg.ico {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--fg-3); pointer-events: none;
  }
  .kbd-hint {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    pointer-events: none;
  }
  .search.filled .kbd-hint { display: none; }
  kbd {
    background: var(--s3); color: var(--fg-3);
    font-size: 11px; padding: 3px 6px; border-radius: 6px;
  }
  .clr {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--s4); color: var(--fg-2);
    display: grid; place-items: center; padding: 0;
    transition: background .14s var(--ease), color .14s var(--ease);
  }
  .clr:hover { background: var(--fg); color: var(--bg); }
  .search.filled .clr { display: grid; }
  .search:not(.filled) .clr { display: none; }

  .icon-btn {
    display: grid; place-items: center;
    width: 36px; height: 36px; border-radius: 10px;
    color: var(--fg-2); background: transparent;
    transition: background .14s var(--ease), color .14s var(--ease);
  }
  .icon-btn:hover { background: var(--s2); color: var(--fg); }
  .icon-btn[aria-pressed="true"] { background: var(--s3); color: var(--fg); }
  .text-btn {
    padding: 8px 12px; border-radius: 10px; font-size: 13.5px;
    color: var(--fg-2); background: transparent; white-space: nowrap;
    display: flex; align-items: center; gap: 7px;
    transition: background .14s var(--ease), color .14s var(--ease);
  }
  .text-btn:hover { background: var(--s2); color: var(--fg); }
  .badge {
    font-size: 11px; background: var(--fg); color: var(--bg);
    border-radius: 999px; padding: 1px 6px; font-weight: 600;
  }

  /* ---------------------------------------------------------- status strip */
  .strip {
    max-width: 1280px; margin: 0 auto; padding: 0 var(--pad) 12px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--fg-3);
    font-family: ui-monospace, SFMono-Regular, "Geist Mono", monospace;
  }
  .strip b { color: var(--fg-2); font-weight: 500; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    font-size: 12.5px; padding: 4px 8px 4px 11px; border-radius: 999px;
    background: var(--s3); color: var(--fg-2);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .pill button { color: var(--fg-3); font-size: 14px; line-height: 1; padding: 0 2px; }
  .pill button:hover { color: var(--fg); }
  .pill.clear { background: none; padding-left: 0; color: var(--fg-3); }
  .pill.clear:hover { color: var(--fg); }

  /* ---------------------------------------------------------- filters menu */
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 8px);
    width: min(340px, calc(100vw - 32px));
    background: var(--s2); border-radius: 16px; padding: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.38);
    opacity: 0; transform: translateY(-6px) scale(.98);
    pointer-events: none; transform-origin: top right;
    transition: opacity .18s var(--ease), transform .18s var(--ease);
    max-height: min(560px, 70vh); overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--s4) transparent;
  }
  [data-theme="light"] .menu { box-shadow: 0 6px 24px rgba(0,0,0,.10); }
  .menu.open { opacity: 1; transform: none; pointer-events: auto; }
  .menu h4 {
    margin: 10px 10px 7px; font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .11em; color: var(--fg-3);
  }
  .menu label.opt {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--fg-2);
    transition: background .12s var(--ease), color .12s var(--ease);
  }
  .menu label.opt:hover { background: var(--s3); color: var(--fg); }
  .menu label.opt input { accent-color: var(--fg); width: 15px; height: 15px; }
  .menu label.opt .c { margin-left: auto; font-size: 11.5px; color: var(--fg-3); }
  .menu .seg { display: flex; gap: 3px; padding: 3px; background: var(--s1); border-radius: 10px; margin: 0 8px; }
  .menu .seg button {
    flex: 1; padding: 6px 8px; border-radius: 7px; font-size: 12.5px; color: var(--fg-3);
    transition: background .14s var(--ease), color .14s var(--ease);
  }
  .menu .seg button[aria-pressed="true"] { background: var(--s3); color: var(--fg); }
  .menu .tags { display: flex; flex-wrap: wrap; gap: 5px; padding: 2px 10px 8px; }
  .menu .tags button {
    font-size: 12px; padding: 4px 9px; border-radius: 999px;
    background: var(--s1); color: var(--fg-3);
    transition: background .14s var(--ease), color .14s var(--ease);
  }
  .menu .tags button:hover { background: var(--s3); color: var(--fg); }
  .menu .tags button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
  .menu hr { border: 0; height: 1px; background: var(--s3); margin: 8px 10px; }

  /* ---------------------------------------------------------- content */
  main { max-width: 1280px; margin: 0 auto; padding: 22px var(--pad) 40px; }

  .grp { margin-bottom: 62px; }
  .grp-title {
    font-size: 31px; font-weight: 600; margin: 0 0 4px;
    letter-spacing: -0.035em; line-height: 1.1;
    display: flex; align-items: baseline; gap: 13px; flex-wrap: wrap;
  }
  .grp-title .n {
    font-size: 12px; font-weight: 450; color: var(--fg-3); letter-spacing: 0;
    white-space: nowrap;
  }
  .cat { margin-bottom: 34px; scroll-margin-top: 132px; }
  .cat-title {
    font-size: 12.5px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .1em; color: var(--fg-3);
    margin: 0 0 13px; display: flex; align-items: baseline; gap: 9px;
  }
  .cat-title .n { color: var(--fg-2); font-weight: 500; letter-spacing: 0; }
  .cat-title button { margin-left: auto; color: var(--fg-3); font-size: 11px; }
  .cat-title button:hover { color: var(--fg); }

  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

  .card {
    background: var(--s1); border-radius: var(--r); padding: 16px 18px;
    display: flex; flex-direction: column; gap: 6px;
    transition: background .16s var(--ease);
    animation: rise .34s var(--ease) both;
  }
  .card:hover { background: var(--s2); }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  .card a.t {
    color: var(--fg); font-weight: 500; font-size: 16px;
    letter-spacing: -0.021em; line-height: 1.32; text-decoration: none;
  }
  .card a.t:hover { text-decoration: underline; text-underline-offset: 3px; }
  .card .d { color: var(--fg-2); font-size: 13.5px; line-height: 1.5; }
  .card .meta {
    display: flex; align-items: center; gap: 8px; margin-top: 3px;
    font-size: 11.5px; color: var(--fg-3);
  }
  .card .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .where { color: var(--fg-2); }
  .card .meta .where::after { content: "\00b7"; margin: 0 7px; color: var(--fg-3); }
  .card .g { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
  .card .g button {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: var(--s2); color: var(--fg-3);
    transition: background .14s var(--ease), color .14s var(--ease);
  }
  .card .g button:hover { background: var(--s3); color: var(--fg); }
  .card .g button.hi { background: var(--s4); color: var(--fg); font-weight: 500; }
  mark { background: none; color: var(--fg); font-weight: 650; }

  /* skeleton: opacity breath, no gradient anywhere on this page */
  .skel { background: var(--s1); border-radius: var(--r); padding: 16px 18px;
          display: flex; flex-direction: column; gap: 9px; animation: breathe 1.5s ease-in-out infinite; }
  .skel i { display: block; height: 11px; border-radius: 5px; background: var(--s2); }
  .skel i:nth-child(1) { width: 62%; height: 14px; }
  .skel i:nth-child(2) { width: 100%; }
  .skel i:nth-child(3) { width: 44%; }
  @keyframes breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

  .sentinel { height: 2px; }
  .loading {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 30px 0 50px; color: var(--fg-3); font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, "Geist Mono", monospace;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-3); animation: pulse 1.1s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  .empty { padding: 110px 20px; text-align: center; color: var(--fg-3); font-size: 17px; }
  .empty code { background: var(--s2); padding: 3px 8px; border-radius: 7px; color: var(--fg-2); }

  footer {
    max-width: 1280px; margin: 0 auto;
    color: var(--fg-3); font-size: 13px; text-align: center;
    padding: 40px var(--pad) 64px; line-height: 1.9;
  }
  footer code { background: var(--s2); padding: 2px 7px; border-radius: 6px; }

  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .grp-title { font-size: 24px; }
    .bar { flex-wrap: wrap; padding: 12px 16px; }
    .brand { order: 1; }
    .search { order: 3; flex-basis: 100%; max-width: none; }
    .grow { order: 2; }
    main { padding: 18px 16px 30px; }
    .strip { padding: 0 16px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

<script src="all.js"></script>
<script>
(function () {
  'use strict';
  // Note the local names must differ from the globals: `const TAGS = TAGS` is a
  // temporal-dead-zone error, not a no-op.
  const B = BOOKMARKS, CATS = CATEGORIES, TAG_LIST = TAGS, GROUPS_ = GROUPS;

  const slug = (s) =>
    String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const catAnchor = (c) => 'cat-' + slug(c);
  const groupAnchor = (g) => 'grp-' + slug(g);

  document.title = 'Dev Bookmarks \u2014 ' + B.length.toLocaleString('en-US') + ' free & open-source resources';

  const $ = (s) => document.querySelector(s);
  const out = $('#out'), q = $('#q'), clr = $('#clr');
  const searchWrap = $('#searchWrap'), pills = $('#pills');
  const fbtn = $('#fbtn'), menu = $('#filters'), fcount = $('#fcount');
  const shownEl = $('#shown');

  const CAT_TO_GROUP = new Map();
  for (const [g, cs] of GROUPS_) for (const c of cs) CAT_TO_GROUP.set(c, g);
  const GROUP_ORDER = GROUPS_.map(([g]) => g);

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- search index
  //
  // Built once, at load, so that typing never walks the raw data. Six lowercase
  // fields per bookmark plus one joined string:
  //
  //   t title · d description · c category · tags · h host · grp group
  //   all = the six joined, used as a single-substring AND prefilter
  //
  // The joined field is the reason this stays fast on 2,873 rows. Scoring can
  // afford up to six indexOf calls per term, but only for rows that already
  // passed; the prefilter rejects most candidates in one.
  const ROWS = B.map((b) => {
    const host = new URL(b.u).hostname.replace(/^www\./, '');
    const t = b.t.toLowerCase();
    const d = b.d.toLowerCase();
    const c = b.c.toLowerCase();
    const tags = b.g.map((x) => x.toLowerCase());
    const h = host.toLowerCase();
    const grp = (CAT_TO_GROUP.get(b.c) || '').toLowerCase();
    return { b, host, t, d, c, tags, h, grp, all: t + ' ' + d + ' ' + c + ' ' + tags.join(' ') + ' ' + h + ' ' + grp };
  });

  // Tags are the highest-value axis, so they get a dedicated set for O(1)
  // exact lookup instead of a scan of the tag array on every keystroke.
  const TAG_INDEX = new Map();
  for (const r of ROWS) for (const t of r.tags) {
    let list = TAG_INDEX.get(t);
    if (!list) TAG_INDEX.set(t, (list = []));
    list.push(r);
  }

  const TAG_FREQ = new Map();
  for (const r of ROWS) for (const t of r.b.g) TAG_FREQ.set(t, (TAG_FREQ.get(t) || 0) + 1);
  const TOP_TAGS = [...TAG_FREQ.entries()].sort((a, b) => b[1] - a[1]).slice(0, 28).map(([t]) => t);

  const GROUP_COUNT = new Map();
  for (const r of ROWS) GROUP_COUNT.set(r.grp, (GROUP_COUNT.get(r.grp) || 0) + 1);

  // all.js is sorted by category name, so its native order interleaves groups —
  // Software & Dev, then Science, then Software & Dev again. Grouped mode has to
  // re-sort by group first, or the renderer emits a fresh <section> every time
  // the group changes and the same heading appears five times on the page.
  const GROUP_RANK = new Map(GROUP_ORDER.map((g, i) => [g.toLowerCase(), i]));
  const byGroupThenCategory = (a, b) => {
    const ga = GROUP_RANK.get(a.grp), gb = GROUP_RANK.get(b.grp);
    if (ga !== gb) return (ga ?? 1e9) - (gb ?? 1e9);
    return a.c.localeCompare(b.c);
  };

  // ---- state
  const state = {
    terms: [], tags: [], groups: new Set(), sort: 'grouped',
    results: [], queue: [], cursor: 0, done: false, busy: false,
  };

  // ---- scoring
  //
  // Every term must match something, and the score is where it matched, so that
  // typing "rust" puts a book titled "Rust" above a page that merely mentions it
  // in its description. Weights, highest first:
  //
  //   1000 exact tag        980 title starts with   820 word-start in title
  //    800 title contains    700 category starts     560 group starts
  //    520 host starts       480 host contains       300 description contains
  //
  // A `#tag` term is matched against the tag set only, never the free text: a
  // literal `#` almost never appears in a title, and letting it fall through to
  // a substring search is what makes a tag filter feel broken.
  const EXACT = new Set(TAG_LIST);

  function scoreRow(r, terms, tagTerms) {
    // single pass, single string: reject the row before any scoring work
    for (const t of terms) if (r.all.indexOf(t) === -1) return 0;
    for (const t of tagTerms) if (r.tags.indexOf(t) === -1) return 0;

    let total = 0;
    for (const t of terms) {
      let best = 0;

      if (r.t.indexOf(t) === 0) best = 980;
      else {
        const at = r.t.indexOf(t);
        if (at > 0) best = at === 0 || r.t[at - 1] === ' ' ? 820 : 800 - Math.min(at, 150);
      }
      if (r.c.indexOf(t) === 0) best = Math.max(best, 700);
      else if (r.c.indexOf(t) > 0) best = Math.max(best, 560 - Math.min(r.c.indexOf(t), 150));
      if (r.grp.indexOf(t) === 0) best = Math.max(best, 560);
      else if (r.grp.indexOf(t) > 0) best = Math.max(best, 440 - Math.min(r.grp.indexOf(t), 150));
      if (r.h.indexOf(t) === 0) best = Math.max(best, 520);
      else if (r.h.indexOf(t) > 0) best = Math.max(best, 480 - Math.min(r.h.indexOf(t), 150));
      if (r.d.indexOf(t) > 0) best = Math.max(best, 300);
      // a free-text term that is also a real tag should behave like a tag
      // search, which is what someone typing "books" or "reference" means
      if (r.tags.indexOf(t) !== -1) best = Math.max(best, 1000);

      if (best === 0) return 0;
      total += best;
    }
    // an exact tag match outranks any free-text match, which is what someone
    // typing "reference" or "books" is actually asking for
    for (const t of tagTerms) if (EXACT.has(t)) total += 1000;

    return total;
  }

  // Bounded edit distance, the last resort and only for short terms. The
  // subsequence test above cannot fix a substitution, so "phyton" found
  // nothing even though "python" is one keystroke away. Capped at distance 2 and
  // at terms of 8 characters or fewer, so it can never become the slow path.
  function editDistance(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 99;
    const prev = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      let last = prev[0];
      prev[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const cur = prev[j];
        prev[j] = Math.min(
          prev[j] + 1,
          prev[j - 1] + 1,
          last + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
        last = cur;
      }
    }
    return prev[b.length];
  }

  function nearRow(r, terms) {
    for (const t of terms) {
      if (t.length < 4 || t.length > 8) return 0;
      let best = 99;
      for (const cand of [r.t, ...r.tags]) {
        if (Math.abs(cand.length - t.length) > 2) continue;
        const head = cand.slice(0, t.length + 2);
        const d = editDistance(t, head);
        if (d < best) best = d;
        if (best === 0) break;
      }
      if (best > 2) return 0;
    }
    return 90;
  }

  // Typo tolerance, as a *fallback only*: "grphtre" should still find "gnuplot",
  // but only when a literal search found nothing at all.
  //
  // Applying it always was a real bug. "antenna" contains a, n, t, e, n, n, a —
  // seven characters with three repeats — so it matches as a subsequence in a
  // large share of unrelated titles, and a search for it returned 213 results
  // of which only 29 actually contained the word. A gap bound keeps the
  // remaining matches local rather than scattered across the whole title.
  function fuzzyRow(r, terms) {
    for (const t of terms) {
      if (t.length < 3) return 0;
      let i = 0, last = -1;
      for (let k = 0; k < r.t.length && i < t.length; k++) {
        if (r.t[k] === t[i]) {
          if (last !== -1 && k - last > 3) return 0;   // too scattered
          last = k;
          i++;
        }
      }
      if (i < t.length) return 0;
    }
    return 120;
  }

  function compute() {
    const active = state.terms.length || state.tags.length || state.groups.size;
    if (!active) {
      state.results = state.sort === 'az'
        ? [...ROWS].sort((a, b) => a.t.localeCompare(b.t))
        : state.sort === 'za'
          ? [...ROWS].sort((a, b) => b.t.localeCompare(a.t))
          : [...ROWS].sort(byGroupThenCategory);
      return;
    }
    const tagTerms = state.tags;
    const terms = state.terms;
    const scored = [];

    if (terms.length) {
      for (const r of ROWS) {
        if (state.groups.size && !state.groups.has(r.grp)) continue;
        const s = scoreRow(r, terms, tagTerms);
        if (!s) continue;
        scored.push([s, r]);
      }
      // widen only when the literal pass came back empty, and only to a bounded
      // edit distance: a subsequence match on a 7-letter word like "antenna"
      // matched 203 of 2,873 rows, so the fallback is strictly a last resort
      if (!scored.length) {
        for (const r of ROWS) {
          if (state.groups.size && !state.groups.has(r.grp)) continue;
          const s = nearRow(r, terms) || fuzzyRow(r, terms);
          if (!s) continue;
          scored.push([s, r]);
        }
      }
      scored.sort((a, b) => b[0] - a[0] || a[1].t.localeCompare(b[1].t));
      state.results = scored.map(([, r]) => r);
      return;
    }

    // tag-only query: walk the inverted index instead of the row list, which is
    // the difference between intersecting 644 tag buckets and scanning 2,873
    // rows with an Array.includes per row
    if (tagTerms.length) {
      let bucket = null;
      for (const t of tagTerms) {
        const list = TAG_INDEX.get(t);
        if (!list) { bucket = null; break; }
        if (!bucket) { bucket = new Set(list); continue; }
        const keep = new Set();
        for (const r of list) if (bucket.has(r)) keep.add(r);
        bucket = keep;
      }
      state.results = bucket
        ? [...bucket].filter((r) => !state.groups.size || state.groups.has(r.grp))
              .sort((a, b) => a.c.localeCompare(b.c) || a.t.localeCompare(b.t))
        : [];
      return;
    }

    state.results = ROWS.filter((r) => !state.groups.size || state.groups.has(r.grp));
  }

  // ---- highlight
  function mark(text, terms) {
    if (!terms.length) return esc(text);
    const low = text.toLowerCase();
    const hits = [];
    for (const t of terms) {
      let i = low.indexOf(t);
      while (i !== -1) { hits.push([i, i + t.length]); i = low.indexOf(t, i + 1); }
    }
    if (!hits.length) return esc(text);
    hits.sort((a, b) => a[0] - b[0]);
    const merged = [hits[0]];
    for (const h of hits.slice(1)) {
      const last = merged[merged.length - 1];
      if (h[0] <= last[1]) last[1] = Math.max(last[1], h[1]);
      else merged.push(h);
    }
    let outp = '', at = 0;
    for (const [a, b] of merged) {
      outp += esc(text.slice(at, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>';
      at = b;
    }
    return outp + esc(text.slice(at));
  }

  const HI = new Set(['must-read', 'must-do', 'must-use', 'must-know', 'must-watch', 'must-bookmark']);

  // `why` is shown only when a query is active. Without it a card that matched
  // on its group name is indistinguishable from one that matched on its title,
  // so searching "antenna" returns the whole "Radio, Antennas & RF" group with
  // no visible reason why — which reads as the search being broken.
  function card(r, why) {
    const el = document.createElement('div');
    el.className = 'card';
    const tags = r.b.g
      .map((t) => {
        const key = t.toLowerCase();
        const cls = ' class="' + (HI.has(key) ? 'hi' : '') + '"';
        return '<button type="button"' + cls + ' data-tag="' + esc(key) + '">' + esc(t) + '</button>';
      })
      .join('');
    el.innerHTML =
      '<a class="t" target="_blank" rel="noopener noreferrer" href="' + esc(r.b.u) + '">' +
        mark(r.b.t, state.terms) + '</a>' +
      '<div class="d">' + mark(r.b.d, state.terms) + '</div>' +
      '<div class="meta">' +
        (why ? '<span class="where">' + esc(why) + '</span>' : '') +
        '<span class="host">' + esc(r.host) + '</span>' +
      '</div>' +
      '<div class="g">' + tags + '</div>';
    return el;
  }

  // Which field caused the match, so the card can say so.
  function matchReason(r) {
    const t = state.terms[0];
    if (!t) return r.c;
    if (r.tags.indexOf(t) !== -1) return r.c + ' \u00b7 #' + t;
    if (r.t.indexOf(t) !== -1) return r.c;
    if (r.c.indexOf(t) !== -1) return r.c;
    if (r.grp.indexOf(t) !== -1) return r.grp;
    if (r.h.indexOf(t) !== -1) return r.h;
    // nothing matched literally, so this came from the typo fallback: say so
    // rather than implying the word is really in that field
    return r.c + ' \u00b7 near match';
  }

  // ---- rendering: chunks fed by an IntersectionObserver
  const CHUNK = 8;           // blocks per batch
  // Load well before the sentinel is visible, so a flick of the wheel never
  // outruns the fetcher and the user hits a spinner mid-page.
  const AHEAD = 1600;
  const observer = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting)) load();
  }, { rootMargin: AHEAD + 'px 0px' });

  let sentinel = null, loadEl = null;

  function skeleton(n) {
    let h = '';
    for (let i = 0; i < n; i++) h += '<div class="skel"><i></i><i></i><i></i></div>';
    out.innerHTML = '<div class="grid">' + h + '</div>';
  }

  // Build the ordered list of blocks to render. Grouped mode keeps the original
  // structure; once a query is active, results are flat and ranked, because
  // grouping a search result by category is noise.
  function buildQueue() {
    const q_ = [];
    // Grouped only when grouping means something. Under A-Z or Z-A, or with an
    // active query, the natural order is already meaningful; forcing it into
    // group sections produced a heading followed by a single card, repeated
    // hundreds of times down the page.
    const grouped = state.sort === 'grouped' && !state.terms.length && !state.tags.length && !state.groups.size;
    if (!grouped) {
      let buf = [];
      for (const r of state.results) {
        buf.push(r);
        if (buf.length === 24) { q_.push(buf); buf = []; }
      }
      if (buf.length) q_.push(buf);
      return q_;
    }
    let curGroup = null, curCat = null, buf = null;
    for (const r of state.results) {
      const g = CAT_TO_GROUP.get(r.b.c) || 'Other';
      if (g !== curGroup) { q_.push({ h: 'grp', g }); curGroup = g; curCat = null; }
      if (r.b.c !== curCat) { buf = []; q_.push({ h: 'cat', c: r.b.c, rows: buf }); curCat = r.b.c; }
      buf.push(r);
    }
    // group consecutive same-category rows so each chunk is a whole category
    const out_ = [];
    for (const b of q_) {
      if (b.h === 'cat' && out_.length && out_[out_.length - 1].h === 'cat' &&
          out_[out_.length - 1].c === b.c) {
        out_[out_.length - 1].rows.push(...b.rows);
      } else out_.push(b);
    }
    return out_;
  }

  function paintBlocks(blocks) {
    const frag = document.createDocumentFragment();
    // state.host, not a local: a chunk boundary can land mid-group, and a local
    // would be null on the next call, sending every later category to the end of
    // <main> — past the sentinel — so the observer would never see it again and
    // loading would stop at an arbitrary point.
    for (const b of blocks) {
      if (b.h === 'grp') {
        const sec = document.createElement('section');
        sec.className = 'grp';
        sec.id = groupAnchor(b.g);
        sec.innerHTML = '<h2 class="grp-title">' + esc(b.g) +
          ' <span class="n">' + (GROUP_COUNT.get(b.g.toLowerCase()) || 0) + ' links</span></h2>';
        frag.appendChild(sec);
        state.host = sec;
      } else if (b.h === 'cat') {
        const sec = document.createElement('section');
        sec.className = 'cat';
        sec.id = catAnchor(b.c);
        const g = document.createElement('div');
        g.className = 'grid';
        for (const r of b.rows) g.appendChild(card(r));
        sec.innerHTML = '<h3 class="cat-title"><span class="n">' + b.rows.length + '</span>' + esc(b.c) + '</h3>';
        sec.appendChild(g);
        (state.host || out).appendChild(sec);
      } else {
        const g = document.createElement('div');
        g.className = 'grid';
        g.style.marginBottom = '34px';
        const why = state.terms.length;
        for (const r of b) g.appendChild(card(r, why ? matchReason(r) : ''));
        frag.appendChild(g);
      }
    }
    return frag;
  }

  function load() {
    if (state.done || state.busy || !state.queue.length) return;
    state.busy = true;
    const blocks = state.queue.splice(0, CHUNK);
    const frag = paintBlocks(blocks);
    out.insertBefore(frag, loadEl);
    // the skeleton is only a placeholder for the first paint; leaving it in
    // would sit at the top of the page for the rest of the session
    const sk = out.querySelector('.grid > .skel');
    if (sk) sk.closest('.grid').remove();
    state.cursor += blocks.reduce((a, b) => a + (b.rows ? b.rows.length : b.length || 0), 0);
    updateStrip();
    state.busy = false;
    if (!state.queue.length) { finish(); return; }

    // An IntersectionObserver only fires when intersection *changes*. After
    // inserting a chunk the sentinel is still on screen, so no new event ever
    // arrives and the page stops loading with a spinner still spinning. Keep
    // going while it remains near the viewport, yielding a frame between
    // batches so a long queue never blocks input.
    requestAnimationFrame(() => {
      if (sentinel && sentinel.getBoundingClientRect().top < innerHeight + AHEAD) load();
    });
  }

  function finish() {
    state.done = true;
    observer.disconnect();
    if (sentinel) sentinel.remove();
    if (loadEl) loadEl.remove();
  }

  function render() {
    compute();
    out.textContent = '';
    state.cursor = 0;
    state.done = false;
    state.busy = false;
    state.host = null;
    observer.disconnect();
    if (sentinel) sentinel.remove();

    if (!state.results.length) {
      if (loadEl) loadEl.remove();
      out.innerHTML = '<div class="empty">No matches.<br>Try a shorter word, or clear the filters.</div>';
      shownEl.textContent = '0';
      updatePills();
      return;
    }

    state.queue = buildQueue();
    shownEl.textContent = state.results.length.toLocaleString('en-US');
    updatePills();

    if (state.results.length > 30) skeleton(6);
    loadEl = document.createElement('div');
    loadEl.className = 'loading';
    loadEl.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    out.appendChild(loadEl);

    load();
    if (!state.done) {
      sentinel = document.createElement('div');
      sentinel.className = 'sentinel';
      out.appendChild(sentinel);
      observer.observe(sentinel);
    }
  }

  function updateStrip() {
    const loaded = state.cursor;
    shownEl.textContent = state.done
      ? state.results.length.toLocaleString('en-US')
      : loaded.toLocaleString('en-US') + ' of ' + state.results.length.toLocaleString('en-US');
  }

  // ---- active filter pills
  function updatePills() {
    pills.textContent = '';
    const add = (label, onClear) => {
      const s = document.createElement('span');
      s.className = 'pill';
      s.innerHTML = '<span>' + esc(label) + '</span>';
      const b = document.createElement('button');
      b.setAttribute('aria-label', 'Remove filter ' + label);
      b.textContent = '×';
      b.onclick = onClear;
      s.appendChild(b);
      pills.appendChild(s);
    };
    for (const t of state.tags) add('#' + t, () => { state.tags = state.tags.filter((x) => x !== t); syncTagButtons(); render(); });
    for (const g of state.groups) add(g, () => { state.groups.delete(g); syncGroupBoxes(); render(); });
    const n = state.tags.length + state.groups.size;
    fcount.hidden = n === 0;
    fcount.textContent = n;
  }

  // ---- filters menu
  const groupList = $('#groupList');
  for (const g of GROUP_ORDER) {
    const key = g.toLowerCase();
    const l = document.createElement('label');
    l.className = 'opt';
    l.innerHTML = '<input type="checkbox" value="' + esc(key) + '"><span>' + esc(g) +
      '</span><span class="c">' + (GROUP_COUNT.get(key) || 0) + '</span>';
    l.querySelector('input').onchange = (e) => {
      if (e.target.checked) state.groups.add(key); else state.groups.delete(key);
      render();
    };
    groupList.appendChild(l);
  }

  const tagList = $('#tagList');
  for (const t of TOP_TAGS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = t;
    b.setAttribute('aria-pressed', 'false');
    b.dataset.tag = t.toLowerCase();
    b.onclick = () => {
      const k = t.toLowerCase();
      if (state.tags.includes(k)) state.tags = state.tags.filter((x) => x !== k);
      else state.tags.push(k);
      syncTagButtons();
      render();
    };
    tagList.appendChild(b);
  }

  const syncTagButtons = () => {
    for (const b of tagList.children) b.setAttribute('aria-pressed', String(state.tags.includes(b.dataset.tag)));
  };
  const syncGroupBoxes = () => {
    for (const i of groupList.querySelectorAll('input')) i.checked = state.groups.has(i.value);
  };

  for (const b of $('#sortSeg').children) {
    b.onclick = () => {
      state.sort = b.dataset.sort;
      for (const o of $('#sortSeg').children) o.setAttribute('aria-pressed', String(o === b));
      render();
    };
  }

  $('#freset').onclick = () => {
    state.tags = []; state.groups.clear(); state.terms = []; q.value = '';
    searchWrap.classList.remove('filled');
    syncTagButtons(); syncGroupBoxes(); render();
  };

  const setMenu = (open) => {
    menu.classList.toggle('open', open);
    fbtn.setAttribute('aria-expanded', String(open));
  };
  fbtn.onclick = (e) => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); };
  document.addEventListener('click', (e) => {
    if (menu.classList.contains('open') && !menu.contains(e.target)) setMenu(false);
  });

  // ---- search input
  let debounce;
  const applyQuery = () => {
    const raw = q.value.trim().toLowerCase();
    const parts = raw.split(/\s+/).filter(Boolean);
    state.terms = parts.filter((p) => !p.startsWith('#')).map((p) => p.replace(/^#/, ''));
    const inline = parts.filter((p) => p.startsWith('#')).map((p) => p.slice(1));
    if (inline.length) {
      state.tags = inline;
      syncTagButtons();
    }
    searchWrap.classList.toggle('filled', !!q.value);
    render();
  };

  q.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(applyQuery, 65); });
  clr.onclick = () => { q.value = ''; state.terms = []; state.tags = []; syncTagButtons(); searchWrap.classList.remove('filled'); q.focus(); render(); };

  // tag click on any card
  out.addEventListener('click', (e) => {
    const b = e.target.closest('.g button[data-tag]');
    if (!b) return;
    const k = b.dataset.tag;
    if (state.tags.includes(k)) state.tags = state.tags.filter((x) => x !== k);
    else state.tags.push(k);
    syncTagButtons();
    render();
  });

  // ---- keyboard
  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); return; }
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); return; }
    if (e.key === 'Escape') {
      if (menu.classList.contains('open')) { setMenu(false); return; }
      if (q.value) { clr.onclick(); } else q.blur();
      return;
    }
    if (e.key === 'Enter' && document.activeElement === q) {
      const first = out.querySelector('.card a.t');
      if (first) window.open(first.href, '_blank', 'noopener');
    }
  });

  $('#top').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  const root = document.documentElement;
  $('#theme').onclick = () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('bm-theme', root.dataset.theme); } catch (err) {}
  };
  try { const s = localStorage.getItem('bm-theme'); if (s) root.dataset.theme = s; } catch (err) {}

  // subtle: the bar gains a tone once content slides under it
  // deep link: index.html#cat-linux-unix jumps to a category
  if (location.hash.length > 1) {
    const want = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if (CATS.some((c) => c.toLowerCase() === want || catAnchor(c).toLowerCase() === want)) {
      state.groups.add(CAT_TO_GROUP.get(CATS.find((c) => c.toLowerCase() === want) || CATS[0])?.toLowerCase() || '');
      syncGroupBoxes();
    }
  }

  render();
})();
</script>
</body>
</html>
