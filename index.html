<!doctype html>
<html lang="en" data-theme="dark">
<head>

<meta name="twitter:card" content="summary">

  "url": "https://sazardev.github.io/awesome-free-resources/",
  "inLanguage": "en",

<style>
  :root {
    --bg: #0d1117; --bg-alt: #010409; --card: #161b22; --card-hi: #1c2333;
    --border: #30363d; --fg: #e6edf3; --fg-dim: #9198a1;
    --accent: #58a6ff; --accent2: #7ee787; --warn: #ffa657; --tagbg: #21262d;
  }
  [data-theme="light"] {
    --bg: #f6f8fa; --bg-alt: #eaeef2; --card: #ffffff; --card-hi: #f0f3f6;
    --border: #d0d7de; --fg: #1f2328; --fg-dim: #59636e;
    --accent: #0969da; --accent2: #1a7f37; --warn: #9a6700; --tagbg: #eaeef2;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
  }
  code, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

  /* ---- header ---- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .hwrap { max-width: 1400px; margin: 0 auto; padding: 12px 20px; }
  .top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
  h1 span { color: var(--fg-dim); font-weight: 400; }
  .spacer { flex: 1 1 auto; }

  .search {
    flex: 2 1 340px; min-width: 220px; position: relative;
  }
  .search input {
    width: 100%; padding: 9px 34px 9px 34px; font-size: 14px;
    background: var(--bg-alt); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .search .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--fg-dim); pointer-events: none; }
  .search .clr { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--fg-dim); cursor: pointer; font-size: 17px; padding: 4px 7px; border-radius: 6px; }
  .search .clr:hover { background: var(--card-hi); color: var(--fg); }

  button.btn {
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  button.btn:hover { background: var(--card-hi); border-color: var(--accent); }

  .meta { display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    margin-top: 10px; font-size: 12.5px; color: var(--fg-dim); }
  .meta b { color: var(--fg); font-weight: 600; }

  /* ---- tag filter row ---- */
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
    max-height: 84px; overflow-y: auto; padding-bottom: 2px; }
  .tag {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
    background: var(--tagbg); border: 1px solid transparent; color: var(--fg-dim);
    user-select: none; white-space: nowrap;
  }
  .tag:hover { color: var(--fg); border-color: var(--border); }
  .tag.on { background: var(--accent); color: #04121f; border-color: var(--accent); font-weight: 600; }
  [data-theme="light"] .tag.on { color: #fff; }

  /* ---- layout ---- */
  main { max-width: 1400px; margin: 0 auto; padding: 22px 20px 90px; }
  section.cat { margin-bottom: 34px; scroll-margin-top: 190px; }
  section.grp { margin-bottom: 44px; }
  h1.grp-title {
    font-size: 21px; margin: 0 0 4px; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 10px;
  }
  h1.grp-title .n { color: var(--fg-dim); font-size: 12px; font-weight: 600;
    background: var(--tagbg); padding: 2px 9px; border-radius: 999px; }
  .grp-rule { height: 1px; background: var(--border); margin: 0 0 20px; }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--fg-dim); margin: 0 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 10px;
  }
  h2 .n { color: var(--accent); font-weight: 700; letter-spacing: 0; }

  .grid { display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 13px; display: flex; flex-direction: column; gap: 5px;
    transition: border-color .12s, transform .12s, background .12s;
  }
  .card:hover { border-color: var(--accent); background: var(--card-hi); transform: translateY(-1px); }
  .card a.t { color: var(--fg); font-weight: 600; font-size: 14px; text-decoration: none; line-height: 1.35; }
  .card a.t:hover { color: var(--accent); text-decoration: underline; }
  .card .d { color: var(--fg-dim); font-size: 12.5px; line-height: 1.45; }
  .card .h { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--fg-dim);
    margin-top: 2px; word-break: break-all; }
  .card .g { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .card .g span { font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
    background: var(--tagbg); color: var(--fg-dim); cursor: pointer; }
  .card .g span:hover { color: var(--accent); }
  .card .g span.must-read, .card .g span.must-do, .card .g span.must-know,
  .card .g span.must-watch, .card .g span.must-use, .card .g span.must-bookmark {
    background: color-mix(in srgb, var(--accent2) 22%, transparent); color: var(--accent2); font-weight: 600; }

  .empty { padding: 70px 20px; text-align: center; color: var(--fg-dim); }
  .empty code { background: var(--tagbg); padding: 2px 6px; border-radius: 5px; }

  footer { border-top: 1px solid var(--border); color: var(--fg-dim);
    font-size: 12px; text-align: center; padding: 20px; }
  footer a { color: var(--accent); }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="top">
      <h1>Dev Bookmarks <span id="count"></span></h1>
      <div class="search">
        <span class="ico">🔍</span>
        <input id="q" type="search" placeholder="Search by title, topic, tag or domain…" autocomplete="off" spellcheck="false">
        <button class="clr" id="clr" title="Clear (Esc)" hidden>×</button>
      </div>
      <button class="btn" id="theme">◐ Theme</button>
      <button class="btn" id="top">↑ Top</button>
    </div>
    <div class="meta">
      <span><b id="shown">0</b> shown</span>
      <span><b id="cats">0</b> categories</span>
      <span><b id="doms">0</b> domains</span>
      <span class="spacer"></span>
      <span>press <kbd>/</kbd> to search · <kbd>Esc</kbd> to clear</span>
    </div>
    <div class="tags" id="tags"></div>
  </div>
</header>

<main id="out"></main>

<footer>
  Free &amp; open-source resources only · built locally · open
  <code>index.html</code> in Chromium and press <kbd>Ctrl/⌘ D</kbd> to bookmark it ·
  or import <code>chromium-bookmarks.html</code> via Bookmark&nbsp;Manager → Import
</footer>

<script src="all.js"></script>
<script>
(function () {
  'use strict';
  const B = BOOKMARKS, CATS = CATEGORIES, TAG_LIST = TAGS, GROUPS_ = GROUPS;
  document.title = 'Dev Bookmarks — ' + B.length + ' free & open-source resources';

  // Top-level grouping comes from all.js, which build.mjs derives from
  // groups.mjs. One source of truth: a category cannot be added to the
  // data and then be missing here.
  const CAT_TO_GROUP = new Map();
  for (const [g, cs] of GROUPS_) for (const c of cs) CAT_TO_GROUP.set(c, g);
  const ORDER = GROUPS_.flatMap(([g]) => g);
  const out = document.getElementById('out');
  const q = document.getElementById('q');
  const clr = document.getElementById('clr');
  const tagsEl = document.getElementById('tags');
  const shownEl = document.getElementById('shown');

  document.getElementById('count').textContent = '· ' + B.length + ' links';
  document.getElementById('cats').textContent = CATS.length;
  document.getElementById('doms').textContent = new Set(B.map(b => new URL(b.u).hostname)).size;

  // Pre-compute a lowercase haystack per item so filtering is a single pass.
  const ROWS = B.map(b => ({
    b,
    hay: (b.t + ' ' + b.d + ' ' + b.c + ' ' + b.g.join(' ') + ' ' + b.u + ' ' + new URL(b.u).hostname).toLowerCase(),
  }));

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Tag chips, ordered by how often they appear so the useful ones come first.
  const freq = new Map();
  for (const b of B) for (const t of b.g) freq.set(t, (freq.get(t) || 0) + 1);
  const ordered = [...freq.entries()].sort((a, b) => b[1] - a[1]);
  for (const [t] of ordered) {
    const s = document.createElement('span');
    s.className = 'tag'; s.textContent = t; s.dataset.tag = t;
    s.onclick = () => { q.value = '#' + t; render(); };
    tagsEl.appendChild(s);
  }

  function card(b) {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      '<a class="t" href="' + esc(b.u) + '" target="_blank" rel="noopener noreferrer">' + esc(b.t) + '</a>' +
      '<div class="d">' + esc(b.d) + '</div>' +
      '<div class="g">' + b.g.map(g => '<span data-tag="' + esc(g) + '">' + esc(g) + '</span>').join('') + '</div>' +
      '<div class="h">' + esc(new URL(b.u).hostname.replace(/^www\./, '')) + '</div>';
    el.querySelector('.g').onclick = e => {
      const s = e.target.closest('span[data-tag]');
      if (s) { q.value = '#' + s.dataset.tag; render(); }
    };
    return el;
  }

  function render() {
    const raw = q.value.trim().toLowerCase();
    // A leading '#' means "match this tag exactly", everything else is free text.
    const parts = raw.split(/\s+/).filter(Boolean);
    const wantTags = parts.filter(t => t.startsWith('#')).map(t => t.slice(1));
    const text = parts.filter(t => !t.startsWith('#'));
    out.textContent = '';
    let total = 0;

    for (const group of ORDER) {
      const cats = CATS.filter((c) => CAT_TO_GROUP.get(c) === group).sort();
      const built = [];
      for (const cat of cats) {
        const rows = ROWS.filter(r =>
          r.b.c === cat &&
          text.every(t => r.hay.includes(t)) &&
          wantTags.every(t => r.b.g.includes(t))
        );
        if (!rows.length) continue;
        total += rows.length;
        built.push([cat, rows]);
      }
      if (!built.length) continue;

      const wrap = document.createElement('section');
      wrap.className = 'grp';
      wrap.id = 'grp-' + group.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
      const n = built.reduce((a, [, r]) => a + r.length, 0);
      const h1 = document.createElement('h1');
      h1.className = 'grp-title';
      h1.innerHTML = group + ' <span class="n">' + n + ' links · ' + built.length + ' categorías</span>';
      wrap.appendChild(h1);
      wrap.appendChild(Object.assign(document.createElement('div'), { className: 'grp-rule' }));

      for (const [cat, rows] of built) {
        const sec = document.createElement('section');
        sec.className = 'cat';
        sec.id = 'cat-' + cat.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
        const h = document.createElement('h2');
        h.innerHTML = '<span class="n">' + rows.length + '</span> ' + esc(cat);
        sec.appendChild(h);
        const g = document.createElement('div');
        g.className = 'grid';
        for (const r of rows) g.appendChild(card(r.b));
        sec.appendChild(g);
        wrap.appendChild(sec);
      }
      out.appendChild(wrap);
    }

    if (!total) {
      out.innerHTML = '<div class="empty">No matches for <code>' + esc(q.value) + '</code>.<br>Try a shorter word, or clear the filters.</div>';
    }
    shownEl.textContent = total;

    // Highlight active tag chips.
    const active = new Set(wantTags);
    for (const chip of tagsEl.children) chip.classList.toggle('on', active.has(chip.dataset.tag));
    clr.hidden = !q.value;
  }

  let t;
  q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 70); });
  clr.onclick = () => { q.value = ''; q.focus(); render(); };
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
    if (e.key === 'Escape') { q.value = ''; render(); q.blur(); }
  });
  document.getElementById('top').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('theme').onclick = () => {
    const h = document.documentElement;
    h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('bm-theme', h.dataset.theme); } catch (e) {}
  };
  try {
    const saved = localStorage.getItem('bm-theme');
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) {}

  // Deep link: index.html#flutter scrolls to that section.
  if (location.hash.length > 1) {
    const want = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    const hit = CATS.find(c => c.toLowerCase() === want);
    if (hit) q.value = hit;
  }
  render();
  if (location.hash.length > 1) {
    const t2 = CATS.find(c => c.toLowerCase() === decodeURIComponent(location.hash.slice(1)).toLowerCase());
    if (t2) setTimeout(() => document.getElementById('cat-' + t2.replace(/[^a-z0-9]+/gi, '-').toLowerCase())
      ?.scrollIntoView({ block: 'start' }), 60);
  }
})();
</script>
</body>
</html>
