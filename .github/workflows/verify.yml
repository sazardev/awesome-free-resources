name: Verify build

# Gate for pull requests: a broken change must never land on main. Rebuilds
# the generated files and fails if the committed copies are stale.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Data files are well-formed
        run: node scripts/check-data.mjs

      - name: Generated files are up to date
        run: |
          node scripts/rebuild.mjs
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run: node scripts/rebuild.mjs"
            git --no-pager diff --stat
            exit 1
          fi
          echo "generated files are current"

      - name: Page is self-contained
        run: |
          grep -q 'src="all.js"' index.html
          if grep -qE 'src="https?://' index.html; then
            echo "::error::index.html depends on a remote script; it must work offline"
            exit 1
          fi
          echo "index.html loads only local assets"
