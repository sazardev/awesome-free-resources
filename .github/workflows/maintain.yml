name: Maintain

# Keeps the generated artefacts (all.js, chromium-bookmarks.html, sitemap.xml,
# robots.txt, _headers, 404.html and the README stats) in sync with data-*.js,
# and re-checks every link so the list degrades honestly instead of rotting.
#
# The heavy lifting lives in scripts/*.mjs rather than inline `run:` blocks:
# inline JS containing backticks and template literals breaks the YAML parser,
# and a script can be tested locally before it ever reaches CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/**'
  schedule:
    # Mondays 04:17 UTC
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      check_links:
        description: Re-verify every URL over HTTP
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: maintain
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Regenerate derived files
        run: node scripts/rebuild.mjs

      - name: Commit
        run: node scripts/commit-generated.mjs

  link-check:
    name: Verify links
    needs: rebuild
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check every URL
        # A non-zero exit means something was flagged, which is expected and
        # handled by the next step, so don't fail the job here.
        continue-on-error: true
        run: node scripts/link-check.mjs

      - name: File the report
        uses: actions/github-script@v8
        with:
          script: scripts/publish-report.cjs
